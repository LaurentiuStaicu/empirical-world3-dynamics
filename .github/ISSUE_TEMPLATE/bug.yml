name: Bug / reproducibility problem
description: Report a reproducible EWD software, script, manifest, or scientific-artifact reproduction problem.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: EWD version or commit
      placeholder: "v0.1.0 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or workflow step
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked whether the retained source/input manifest changed.
          required: true
        - label: This issue does not contain sensitive vulnerability details.
          required: true
