name: Diagnostic source materialization

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    name: Materialize and verify diagnostic source inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.33'

      - name: Validate policy contract
        run: |
          python3 scripts/check_diagnostic_reproducibility_policy.py

      - name: Materialize all pinned diagnostic sources
        run: |
          python3 scripts/fetch_diagnostic_inputs.py

      - name: Recheck materialized cache without network
        run: |
          python3 scripts/fetch_diagnostic_inputs.py --check-only

      - name: Reproduce eGRID retained audits
        run: |
          uv run --with openpyxl==3.1.5 --locked --project science python scripts/audit_egrid.py .diagnostic_sources/egrid/eGRID2021_data.xlsx science/data/energy_audit 2021
          uv run --with openpyxl==3.1.5 --locked --project science python scripts/audit_egrid.py .diagnostic_sources/egrid/egrid2022_data.xlsx science/data/energy_audit 2022
          uv run --with openpyxl==3.1.5 --locked --project science python scripts/audit_egrid.py .diagnostic_sources/egrid/egrid2023_data_rev2.xlsx science/data/energy_audit 2023
          git diff --exit-code --             science/data/energy_audit/egrid2021-audit.json             science/data/energy_audit/egrid2021-cohort.json.gz             science/data/energy_audit/egrid2022-audit.json             science/data/energy_audit/egrid2022-cohort.json.gz             science/data/energy_audit/egrid-audit.json             science/data/energy_audit/egrid-cohort.json.gz

      - name: Reproduce Aramendia EROI retained snapshot
        run: |
          uv run --locked --project science python science/scripts/ingest_aramendia_eroi.py .diagnostic_sources/eroi/global_erois.csv
          git diff --exit-code --             science/data/processed/aramendia_global_fossil_eroi_2024.csv             science/data/processed/aramendia_global_fossil_eroi_2024.provenance.json

      - name: Reproduce Energy Institute retained snapshot
        run: |
          uv run --locked --project science python science/scripts/ingest_energy_institute_2026.py             '.diagnostic_sources/energy/Statistical Review of World Energy Narrow format.csv'             --mirror-commit 9fc01fc0ae5aea3955968f920e5cd1394fe5ad34
          git diff --exit-code --             science/data/processed/energy_institute_global_2026.csv             science/data/processed/energy_institute_global_2026.provenance.json
