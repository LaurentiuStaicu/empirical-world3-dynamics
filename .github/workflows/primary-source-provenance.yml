name: Primary source provenance verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify authoritative primary-source lineage
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download, hash and compare primary sources
        run: |
          python3 scripts/audit_primary_source_closure.py | tee primary-source-provenance-verification.log

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: primary-source-provenance-verification
          path: |
            primary-source-provenance-verification.json
            primary-source-provenance-verification.log
