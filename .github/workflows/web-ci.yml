name: Validate web product

on:
  pull_request:
    paths:
      - 'web/**'
      - 'data/scenarios/**'
      - 'science/configs/real_model_structure.json'
      - 'docs/INFOCLAR_MODEL_SUITE_DESIGN_STANDARD_V1_1.md'
      - 'docs/WEB_V1_PRODUCT_CONTRACT.md'
      - '.github/workflows/web-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'data/scenarios/**'
      - 'science/configs/real_model_structure.json'
      - 'docs/INFOCLAR_MODEL_SUITE_DESIGN_STANDARD_V1_1.md'
      - 'docs/WEB_V1_PRODUCT_CONTRACT.md'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Type-check and build web v1
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install pinned web toolchain
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Verify scientific non-regression contract
        working-directory: web
        run: npm run check

      - name: Build static web product
        working-directory: web
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: world3-empirical-web-v1
          path: web/dist
          if-no-files-found: error
