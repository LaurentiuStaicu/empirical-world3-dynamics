name: Validate pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  science:
    name: Scientific reproduction and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install locked scientific environment
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.33'

      - name: Reproduce scientific outputs
        run: |
          python3 scripts/generate_science_input_manifest.py
          git diff --exit-code -- science/data/input_manifest.json
          uv run --project science --extra world3-03 python scripts/reproduce_scientific_results.py
          uv run --project science --extra world3-03 python scripts/generate_science_test_artifacts.py
          uv run --project science --extra world3-03 python -m unittest discover -s science/tests -v

      - name: Validate release contract and application tests
        run: |
          python3 scripts/generate_integrity_manifest.py
          git diff --exit-code -- data/scenarios/release_integrity.json
          python3 scripts/validate.py
          python3 -m unittest discover -s tests -v

  flatpak:
    name: Flatpak build
    needs: science
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate scientific data and metadata
        run: |
          python3 scripts/validate.py
          python3 -m unittest discover -s tests -v

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: World3-Empirical-ci-x86_64.flatpak
          manifest-path: io.github.laurentiustaicu.World3Empirical.yml
          repository-name: appcenter
          repository-url: https://flatpak.elementary.io/repo.flatpakrepo
          branch: master
          arch: x86_64
          upload-artifact: false
