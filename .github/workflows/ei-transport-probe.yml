name: EI transport probe
on:
  push:
    branches:
      - audit/primary-source-byte-probe
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 scripts/probe_ei_transport.py
