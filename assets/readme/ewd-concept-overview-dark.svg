<svg xmlns="http://www.w3.org/2000/svg" width="760" height="860" viewBox="0 0 760 860" role="img" aria-labelledby="title desc">
  <title id="title">Empirical World3 Dynamics conceptual structure</title>
  <desc id="desc">World3-03 provides the System Dynamics structural core. Observed data and retained provenance form a separate empirical layer used for calibration and candidate selection, followed by validation and sensitivity assessment. Candidate extensions remain outside the central model until explicit promotion gates pass. The retained central trajectory is an experimental scenario model, not a probabilistic forecast.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#a0a0a0"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="380" y="38" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">EWD conceptual structure</text>
    <text x="380" y="68" text-anchor="middle" font-size="18" fill="#a0a0a0">World3-03 core → empirical layer → calibration → validation → extension gates</text>

    <rect x="70" y="105" width="620" height="110" rx="8" fill="#333333" stroke="#a0a0a0" stroke-width="2"/>
    <text x="105" y="140" font-size="24" font-weight="700" fill="#ffffff">World3-03 structural core</text>
    <text x="105" y="172" font-size="18" fill="#a0a0a0">stocks · flows · feedback loops · delays · nonlinear lookups</text>
    <text x="105" y="198" font-size="17" fill="#a0a0a0">numerical integration · canonical System Dynamics structure</text>

    <line x1="380" y1="215" x2="380" y2="250" stroke="#a0a0a0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="398" y="240" font-size="16" fill="#a0a0a0">observed and constrained through</text>

    <rect x="70" y="263" width="620" height="96" rx="8" fill="#333333" stroke="#a0a0a0" stroke-width="2"/>
    <text x="105" y="297" font-size="23" font-weight="700" fill="#ffffff">Empirical observation &amp; provenance</text>
    <text x="105" y="328" font-size="18" fill="#a0a0a0">raw + processed data · source vintages · frozen input manifest</text>
    <text x="105" y="351" font-size="17" fill="#a0a0a0">empirical bridges remain distinct from structural feedbacks</text>

    <line x1="380" y1="359" x2="380" y2="394" stroke="#a0a0a0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="398" y="384" font-size="16" fill="#a0a0a0">used for</text>

    <rect x="70" y="407" width="620" height="112" rx="8" fill="#333333" stroke="#a0a0a0" stroke-width="2"/>
    <text x="105" y="441" font-size="23" font-weight="700" fill="#ffffff">Calibration &amp; candidate selection</text>
    <text x="105" y="472" font-size="18" fill="#a0a0a0">model selection frozen through 2018</text>
    <text x="105" y="496" font-size="17" fill="#a0a0a0">production refit uses observations available through 2025</text>
    <text x="105" y="514" font-size="17" fill="#a0a0a0">central trajectory = medoid of 12 admissible candidates</text>

    <line x1="380" y1="519" x2="380" y2="554" stroke="#a0a0a0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="398" y="544" font-size="16" fill="#a0a0a0">assessed by</text>

    <rect x="70" y="567" width="620" height="112" rx="8" fill="#333333" stroke="#a0a0a0" stroke-width="2"/>
    <text x="105" y="601" font-size="23" font-weight="700" fill="#ffffff">Validation &amp; sensitivity</text>
    <text x="105" y="632" font-size="18" fill="#a0a0a0">2019–latest holdout belongs to model-selection procedure</text>
    <text x="105" y="656" font-size="17" fill="#a0a0a0">P10–P90 = pointwise structural sensitivity envelope</text>
    <text x="105" y="674" font-size="17" fill="#a0a0a0">not a calibrated probability or confidence interval</text>

    <line x1="380" y1="679" x2="380" y2="714" stroke="#a0a0a0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="398" y="704" font-size="16" fill="#a0a0a0">promotion required before coupling</text>

    <rect x="70" y="727" width="620" height="82" rx="8" fill="#333333" stroke="#a0a0a0" stroke-width="2"/>
    <text x="105" y="760" font-size="23" font-weight="700" fill="#ffffff">Candidate extensions</text>
    <text x="105" y="790" font-size="18" fill="#a0a0a0">EROI · climate–water · minerals · AI — inactive by default</text>

    <rect x="120" y="823" width="520" height="30" rx="15" fill="#a0a0a0"/>
    <text x="380" y="844" text-anchor="middle" font-size="16" font-weight="700" fill="#000000">Experimental scenario model · not a probabilistic forecast</text>
  </g>
</svg>
